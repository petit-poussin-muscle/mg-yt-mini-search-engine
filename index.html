<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Petit Poussin Musclé</title>
  <link rel="icon" href="/mg-yt-mini-search-engine/favicon.ico" type="image/png">
  <link rel="stylesheet" href="default.css?rev={{ site.time | date: '%Y%m%d%H%M%S' }}">
</head>
<body>
  <div class="container">
    <nav role="navigation" aria-label="Menu principal">
      <ul class="main-menu">
        <li><a href="index.html" aria-current="page">Recherche classique</a></li>
        <li><a href="questions.html">Recherche de questions</a></li>
        <li><a href="stats.html">Statistiques</a></li>
        <li><a href="about.html">À propos</a></li>
        <li><a href="plugin.html">Extension de navigateur</a></li>
      </ul>
    </nav>
    <h2>Mise à jour le <span id="updated-date">...</span> — <span id="video-count">0</span> vidéos</h2>

    
    <form id="search-form">
      <div class="filters-header">
        <span id="filter-summary" class="filter-summary"></span>
        <button type="button" id="toggle-filters" aria-expanded="false" aria-controls="filters-container">
          Afficher les filtres ▾
        </button>
      </div>

      <div id="filters-container" class="filters-hidden">
        <fieldset>
          <legend>Scope de recherche</legend>
          <label><input type="radio" name="scope" value="all" checked> Titre + Contenu</label>
          <label><input type="radio" name="scope" value="title"> Titre seul</label>
          <label><input type="radio" name="scope" value="body"> Contenu seul</label>
        </fieldset>

        <fieldset>
          <legend>Type de vidéo</legend>
          <label><input type="radio" name="liveFilter" value="all" checked> Tous</label>
          <label><input type="radio" name="liveFilter" value="onlyLive"> Seulement live</label>
          <label><input type="radio" name="liveFilter" value="noLive"> Sans live</label>
        </fieldset>
      </div>

      <label>
        <input type="checkbox" id="show-timecodes" checked>
        Afficher les timecodes des mots-clés
      </label>
      <input id="q" type="text" placeholder="Tapez vos mots-clefs…">
    </form>


    <div class="controls">
      <div id="result-count"></div>
      <select id="sort">
        <option value="date_desc" selected>Date ↓</option>
        <option value="date_asc">Date ↑</option>
        <option value="duration_desc">Durée ↓</option>
        <option value="duration_asc">Durée ↑</option>
        <option value="title_desc">Nom ↓</option>
        <option value="title_asc">Nom ↑</option>
      </select>
    </div>

    <div id="results"></div>
  </div>

  <script>
    // list of files with cache hint (cache: false -> use { cache: 'no-store' })
    const files = [
      { path: "data/index-live-2024-min.json",  key: "live",    cache: true },
      { path: "data/index-nonlive-2024-min.json", key: "nonlive", cache: true },
      { path: "data/index-live-2025-min.json",  key: "live",    cache: false },
      { path: "data/index-nonlive-2025-min.json", key: "nonlive", cache: false }
    ];

    // perform all fetches according to the files array
    Promise.all(
      files.map(f => {
        const opts = (f.cache === false) ? { cache: 'no-store' } : undefined;
        return opts ? fetch(f.path, opts).then(r => r.json()) : fetch(f.path).then(r => r.json());
      })
    ).then(results => {
      // group results by key and merge docs + find latest updated per key
      const grouped = {};
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const json = results[i] || { updated: null, docs: [] };
        if (!grouped[f.key]) grouped[f.key] = { docsRaw: [], updatedTimes: [] };

        if (Array.isArray(json.docs)) grouped[f.key].docsRaw.push(...json.docs);
        if (json.updated) grouped[f.key].updatedTimes.push(new Date(json.updated).getTime());
      }

      function buildMerged(key) {
        const bucket = grouped[key] || { docsRaw: [], updatedTimes: [] };
        // fallback to epoch if no update timestamps found (keeps same behavior as before)
        const latestTs = bucket.updatedTimes.length ? Math.max(...bucket.updatedTimes) : new Date(0).getTime();
        const latestISO = new Date(latestTs).toISOString();
        return { docs: bucket.docsRaw, updated: latestISO };
      }

      const liveData = buildMerged('live');
      const nonliveData = buildMerged('nonlive');

      // keep your original structure
      const dateLive = new Date(liveData.updated);
      const dateNon = new Date(nonliveData.updated);
      const latest = dateLive > dateNon ? dateLive : dateNon;
      document.getElementById('updated-date').textContent = latest.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });

      const total = (liveData.docs?.length || 0) + (nonliveData.docs?.length || 0);
      document.getElementById('video-count').textContent = total;
    }).catch(err => {
      console.error('Erreur chargement des JSON :', err);
    });

    const form       = document.getElementById('search-form');
    const btn        = document.getElementById('toggle-filters');
    const container  = document.getElementById('filters-container');

    btn.addEventListener('click', e => {
      e.preventDefault();  
      const isOpen = form.classList.toggle('filters-open');
      container.classList.toggle('filters-hidden');
      // on retire/ajoute la classe qui contrôle l'affichage
      btn.setAttribute('aria-expanded', isOpen);
      btn.textContent = isOpen
        ? 'Masquer les filtres ▴'
        : 'Afficher les filtres ▾';
    });


    document.addEventListener('DOMContentLoaded', () => {
      const summaryEl   = document.getElementById('filter-summary');
      const scopeInputs = document.querySelectorAll('input[name="scope"]');
      const liveInputs  = document.querySelectorAll('input[name="liveFilter"]');

      function getCheckedLabel(nodeList) {
        const checked = Array.from(nodeList).find(i => i.checked);
        return checked
          ? checked.parentNode.textContent.trim()
          : '';
      }

      function updateFilterSummary() {
        const scopeLabel = getCheckedLabel(scopeInputs);
        const liveLabel  = getCheckedLabel(liveInputs);

        summaryEl.textContent = 
          `Scope de recherche: ${scopeLabel} · Type de video: ${liveLabel}`;
      }

      // initialisation
      updateFilterSummary();

      // mettre à jour au changement
      [...scopeInputs, ...liveInputs].forEach(el =>
        el.addEventListener('change', updateFilterSummary)
      );
    });

  </script>
  <script src="search.js?rev={{ site.time | date: '%Y%m%d%H%M%S' }}" defer></script>
</body>
</html>
