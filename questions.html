<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Petit Poussin Musclé - Recherche de Questions</title>
  <link rel="icon" href="/mg-yt-mini-search-engine/favicon.ico" type="image/png">
  <link rel="stylesheet" href="default.css?rev={{ site.time | date: '%Y%m%d%H%M%S' }}">
</head>
<body>
  <div class="container">
    <nav role="navigation" aria-label="Menu principal">
      <ul class="main-menu">
        <li><a href="index.html">Recherche classique</a></li>
        <li><a href="questions.html" aria-current="page">Recherche de questions</a></li>
        <li><a href="stats.html">Statistiques</a></li>
        <li><a href="about.html">À propos</a></li>
      </ul>
    </nav>
    <h2>Mise à jour le <span id="updated-date">...</span> — <span id="video-count">0</span> questions</h2>

    <form id="search-form" onsubmit="return false;">
      <label for="q">Recherche :</label>
      <input type="text" id="q" placeholder="Tapez vos mots-clés…" autofocus>
    </form>

    <div class="controls">
      <div id="result-count"></div>
      <select id="sort">
        <option value="date_desc" selected>Date ↓</option>
        <option value="date_asc">Date ↑</option>
        <option value="duration_desc">Durée ↓</option>
        <option value="duration_asc">Durée ↑</option>
        <option value="question_desc">Questions ↓</option>
        <option value="question_asc">Questions ↑</option>
      </select>
    </div>

    <div id="results"></div>
  </div>

  <script>
    // list the files to merge; set cache: false when you want no-store (e.g. 2025)
    const files = [
      { path: 'data/questions-2024-min.json', cache: true },
      { path: 'data/questions-2025-min.json', cache: false }
    ];

    async function fetchJsonSafe(path, opts) {
      try {
        const res = opts ? await fetch(path, opts) : await fetch(path);
        if (!res.ok) return { updated: null, docs: [] };
        return await res.json();
      } catch (e) {
        return { updated: null, docs: [] };
      }
    }

    (async () => {
      let mergedDocs = [];
      let lastUpdate = null;

      for (const f of files) {
        const opts = (f.cache === false) ? { cache: 'no-store' } : undefined;
        const json = await fetchJsonSafe(f.path, opts);
        if (Array.isArray(json.docs)) mergedDocs.push(...json.docs);
        if (json.updated) {
          const u = new Date(json.updated);
          if (!lastUpdate || u > lastUpdate) lastUpdate = u;
        }
      }

      if (lastUpdate) {
        document.getElementById('updated-date').textContent =
          lastUpdate.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
      } else {
        document.getElementById('updated-date').textContent = '—';
      }

      document.getElementById('video-count').textContent = mergedDocs.length;
    })();
  </script>
  <script src="questions-search.js?rev={{ site.time | date: '%Y%m%d%H%M%S' }}" defer></script>
</body>
</html>
