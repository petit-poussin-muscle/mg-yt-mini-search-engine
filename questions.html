<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Petit Poussin Musclé - Recherche de Questions</title>
  <!-- Favicon -->
  <link rel="icon" href="/mg-yt-mini-search-engine/favicon.ico" type="image/png">
  <style>
    /* ==== BOX-SIZING GLOBAL ==== */
    *, *::before, *::after { box-sizing: border-box; }
    body { background-color: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; }
    a { color: #1e90ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { max-width: 800px; margin: 0 auto; padding: 2em 1em; }
    nav.main-menu { margin-bottom: 2em; }
    nav.main-menu a { margin-right: 1em; }
    #search-form { display: flex; flex-direction: column; gap: 1em; margin-bottom: 1em; }
    fieldset { border: 1px solid #444; padding: 0.5em; }
    legend { padding: 0 0.5em; font-weight: bold; }
    label { display: block; margin: 0.2em 0; }
    #q { width: 100%; padding: 0.5em; font-size: 1em; border: 1px solid #444; border-radius: 4px; background-color: #111; color: #fff; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5em; }
    #result-count { color: #ccc; font-size: 0.9em; }
    select { padding: 0.3em; font-size: 0.9em; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px; }
    .result { display: flex; align-items: center; background-color: #333; border-radius: 4px; padding: 0.5em; margin-bottom: 1em; }
    .result img { width: 120px; height: 90px; object-fit: cover; margin-right: 1em; border: 1px solid #333; }
    .result p { margin: 0.2em 0 0 0; font-size: 0.9em; color: #ccc; }
    .main-menu{ text-align: center;}
  </style>
</head>
<body>
  <div class="container">
    <nav class="main-menu">
      <a href="index.html">Recherche classique</a>
      <a href="questions.html">Recherche de questions</a>
      <a href="about.html">À propos</a>
    </nav>
    <h2>Mise à jour le <span id="updated-date">...</span> — <span id="video-count">0</span> questions</h2>

    <form id="search-form" onsubmit="return false;">
      <label for="q">Recherche :</label>
      <input type="text" id="q" placeholder="Tapez vos mots-clés…">
    </form>

    <div class="controls">
      <div id="result-count"></div>
      <select id="sort">
        <option value="date_desc" selected>Date ↓</option>
        <option value="date_asc">Date ↑</option>
        <option value="duration_desc">Durée ↓</option>
        <option value="duration_asc">Durée ↑</option>
        <option value="question_desc">Questions ↓</option>
        <option value="question_asc">Questions ↑</option>
      </select>
    </div>

    <div id="results"></div>
  </div>

  <script>
    // Chargement date et compteur pour questions
    fetch('data/questions-min.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(data => {
        const d = new Date(data.updated);
        document.getElementById('updated-date').textContent =
          d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('video-count').textContent = data.docs.length;
      });
  </script>
  <script src="questions-search.js"></script>
</body>
</html>
